<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>審查意見查詢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* =========================================================
   可調整設定（淺色版 v3）
   ========================================================= */
:root{
  /* 色彩 */
  --bg:#F8FAFC;            /* 頁面背景 */
  --card:#FFFFFF;          /* 卡片 */
  --bar:#FFFFFF;           /* 頂部／底部列 */
  --primary:#2563EB;       /* 主色 */
  --primary-light:#EFF6FF; /* 主色淺底 */
  --ink:#0F172A;           /* 主要文字 */
  --ink2:#64748B;          /* 次要文字 */
  --line:#E2E8F0;          /* 邊框 */
  --hl:#FEF08A;            /* 關鍵字標示 */
  --s1:#16A34A; --s1-bg:#DCFCE7;   /* 期初 */
  --s2:#2563EB; --s2-bg:#DBEAFE;   /* 期中 */
  --s3:#7C3AED; --s3-bg:#EDE9FE;   /* 期末 */
  --desk:#E2E8F0;          /* 電腦預覽時手機外背景 */
  /* 字體 */
  --font:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --title:22px; --title-w:700;
  --body:15px; --badge:12px; --lh:1.65;
  /* 造型 */
  --r-card:14px; --r-btn:10px; --strip:4px; --gap:12px; --pad:16px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  /* 預設機型 iPhone 16 Pro */
  --frame-w:402px; --frame-h:874px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F172A;--card:#1E293B;--bar:#1E293B;--ink:#F1F5F9;--ink2:#94A3B8;--line:#334155;
    --primary:#60A5FA;--primary-light:#1E3A8A;--hl:#854D0E;--desk:#020617;
    --s1:#4ADE80;--s1-bg:#14532D;--s2:#60A5FA;--s2-bg:#1E3A8A;--s3:#A78BFA;--s3-bg:#4C1D95;
  }
}
:root[data-theme="dark"]{
  --bg:#0F172A;--card:#1E293B;--bar:#1E293B;--ink:#F1F5F9;--ink2:#94A3B8;--line:#334155;
  --primary:#60A5FA;--primary-light:#1E3A8A;--hl:#854D0E;--desk:#020617;
  --s1:#4ADE80;--s1-bg:#14532D;--s2:#60A5FA;--s2-bg:#1E3A8A;--s3:#A78BFA;--s3-bg:#4C1D95;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--desk);color:var(--ink);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}

/* ---- 手機外框（電腦預覽） ---- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.device{position:relative;width:var(--frame-w);height:var(--frame-h);border-radius:62px;background:#1c1f21;padding:11px;box-shadow:0 0 0 2px #3a3f42,0 30px 60px rgba(0,0,0,.2)}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:1000}
.statusbar{height:54px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 34px 6px 40px;font-weight:600;font-size:16px;background:var(--bar)}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.8;z-index:1000;pointer-events:none}
@media (max-width:520px){
  .stage{padding:0;display:block;height:100%}
  .device{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:none}
  .screen{border-radius:0;padding-top:env(safe-area-inset-top,0px);background:var(--bar)}
  .island,.statusbar,.homebar{display:none}
}

/* ---- 頂部導航 ---- */
.hdr{position:relative;flex:none;background:var(--bar);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm);padding:6px var(--pad) 10px;z-index:500}
.hdr h1{font-size:var(--title);font-weight:var(--title-w);line-height:1.3}
.scope{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:2px;font-size:14px;font-weight:500;color:var(--ink);padding:2px 0}
.scope span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scope .car{flex:none;color:var(--ink2);font-size:11px}
.scope[hidden]{display:none}
.logout{position:absolute;right:var(--pad);top:8px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.logout[hidden]{display:none}

/* ---- 內容區 ---- */
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;background:var(--bg)}
.view[hidden]{display:none}
.controls{padding:12px var(--pad) 4px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 8px 0 14px;height:44px;box-shadow:var(--shadow-sm)}
.search svg{flex:none;color:var(--ink2)}
.search input{flex:1;border:0;background:none;font-size:16px;min-width:0;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--ink2)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search .clr{width:28px;height:28px;border-radius:50%;color:var(--ink2);font-size:18px;line-height:1}
.search .clr[hidden]{display:none}
.seg{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;gap:6px;margin-top:12px}
.seg button{height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;padding:0 4px}
.seg button small{font-size:11px;font-weight:700;padding:0 5px;border-radius:999px;background:var(--bg);min-width:18px}
.seg button[data-s="全部"][aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.seg button[data-s="全部"][aria-pressed="true"] small{background:color-mix(in srgb,var(--card) 22%,transparent);color:var(--card)}
.seg button[data-s="期初"]{--c:var(--s1);--cb:var(--s1-bg)}
.seg button[data-s="期中"]{--c:var(--s2);--cb:var(--s2-bg)}
.seg button[data-s="期末"]{--c:var(--s3);--cb:var(--s3-bg)}
.seg button[data-s]:not([data-s="全部"]){border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--c)}
.seg button[data-s]:not([data-s="全部"]) small{background:var(--cb);color:var(--c)}
.seg button[data-s]:not([data-s="全部"])[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.seg button[data-s]:not([data-s="全部"])[aria-pressed="true"] small{background:rgba(255,255,255,.25);color:#fff}
.row2{display:flex;align-items:center;gap:8px;margin-top:12px}
.who{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;height:38px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:14px;min-width:0}
.who span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.who.on{border-color:var(--primary);color:var(--primary);background:var(--primary-light);font-weight:700}
.reset{font-size:14px;color:var(--ink2);padding:0 6px;height:38px}
.count{font-size:13px;color:var(--ink2);padding:12px var(--pad) 8px}

/* ---- 意見卡片 ---- */
.list{padding:0 var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-sm);padding:14px 14px 0 calc(14px + var(--strip));overflow:hidden;cursor:pointer}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--strip);background:var(--c)}
.card[data-s="期初"],.mt[data-s="期初"]{--c:var(--s1);--cb:var(--s1-bg)}
.card[data-s="期中"],.mt[data-s="期中"]{--c:var(--s2);--cb:var(--s2-bg)}
.card[data-s="期末"],.mt[data-s="期末"]{--c:var(--s3);--cb:var(--s3-bg)}
.tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg{font-size:var(--badge);padding:2px 8px;border-radius:6px;font-weight:500;background:var(--bg);color:var(--ink2);border:1px solid var(--line);line-height:1.5}
.tg.st{background:var(--cb);color:var(--c);border-color:transparent;font-weight:700}
.tg.mb{color:var(--ink);font-weight:700}
.tg.pj{background:var(--primary-light);color:var(--primary);border-color:transparent;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.txt{white-space:pre-line;font-size:var(--body);line-height:var(--lh);margin-top:10px;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.card.exp .txt{display:block;-webkit-line-clamp:unset;overflow:visible}
.morehint{font-size:12.5px;color:var(--primary);margin-top:4px;display:none}
.card.clamped .morehint{display:block}
.resp-btn{margin:12px -14px 0 0;width:calc(100% + 14px);display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink);padding:11px 0;border-top:1px solid var(--line)}
.resp-btn .chev{font-size:10px;color:var(--ink2);transition:transform .2s}
.resp-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.resp{white-space:pre-line;font-size:14px;line-height:var(--lh);color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0 0 14px;cursor:auto;word-break:break-word}
.resp[hidden]{display:none}
.noresp{margin:12px -14px 0 0;font-size:13px;color:var(--ink2);padding:11px 0;border-top:1px solid var(--line);text-align:center}
.empty{text-align:center;color:var(--ink2);padding:48px 24px;font-size:14px;line-height:1.8}
.more{display:block;margin:14px auto 0;font-size:14px;color:var(--primary);font-weight:700;padding:10px 20px;border:1px solid var(--line);border-radius:999px;background:var(--card)}

/* ---- 委員／會議 ---- */
.sec-h{font-size:13px;font-weight:700;color:var(--ink2);padding:18px var(--pad) 8px}
.group{margin:0 var(--pad);background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-sm)}
.pr{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .nm{flex:1;font-size:15px;font-weight:500;min-width:0}
.pr.sel .nm{color:var(--primary);font-weight:700}
.dots{display:flex;gap:4px}
.dot{min-width:26px;height:22px;border-radius:6px;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;padding:0 4px}
.dot.s1{background:var(--s1)}.dot.s2{background:var(--s2)}.dot.s3{background:var(--s3)}
.dot.zero{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:400}
.legend{display:flex;gap:12px;padding:14px var(--pad) 0;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mt{margin:0 var(--pad) var(--gap);width:calc(100% - 2*var(--pad));display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px 14px calc(16px + var(--strip));position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.mt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--strip);background:var(--c)}
.mt .big{font-size:20px;font-weight:700;color:var(--c)}
.mt .big small{font-size:13px;margin-left:6px}
.mt .pjn{font-size:12px;color:var(--ink2);margin-top:2px;padding-right:70px}
.mt .n{position:absolute;right:16px;top:14px;font-size:13px;color:var(--ink2)}
.mt .n b{font-size:22px;color:var(--ink);font-weight:700}
.info{margin-top:8px}
.info-row{display:flex;align-items:baseline;margin-bottom:6px;font-size:13.5px;line-height:1.5}
.info-row:last-child{margin-bottom:0}
.info-label{width:76px;flex-shrink:0;color:var(--ink2)}
.info-value{flex:1;color:var(--ink);font-weight:500;word-break:break-word;min-width:0}
.info-value.num{color:var(--primary)}

/* ---- 地圖 ---- */
#v-map{position:relative;overflow:hidden;padding:0}
#map{position:absolute;inset:0;background:#E8EEF5;z-index:1}
.map-top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;z-index:600;pointer-events:none}
.county{pointer-events:auto;position:relative;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-md);font-size:14px;font-weight:500;height:36px;padding:0 30px 0 14px}
.county select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.county::after{content:"▾";position:absolute;right:12px;color:var(--ink2);font-size:12px}
.mapbtns{position:absolute;right:10px;top:56px;display:flex;flex-direction:column;gap:8px;z-index:600}
.mapbtns button{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:20px;line-height:1}
.mapbtns button.locating{color:var(--primary)}
.nocoord{position:absolute;left:10px;bottom:10px;z-index:600;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:12.5px;padding:6px 12px;box-shadow:var(--shadow-md);color:var(--ink2)}
.nocoord[hidden]{display:none}
.nocoord{bottom:48px}
.mlegend{position:absolute;left:10px;bottom:10px;z-index:600;display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:12px;padding:5px 12px;box-shadow:var(--shadow-md);color:var(--ink2)}
.mlegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#v-map.sheeton .mlegend{display:none}
.bsheet:not(.off)~.nocoord,#v-map.sheeton .nocoord{display:none}
.pin{width:30px!important;height:38px!important}
.pin svg{display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));transition:transform .15s}
.pin.on svg{transform:scale(1.25);transform-origin:50% 100%}
.me-dot{width:16px!important;height:16px!important;border-radius:50%;background:#2563EB;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,.35),0 1px 4px rgba(0,0,0,.3)}
.leaflet-container{font-family:var(--font)}
.leaflet-control-attribution{font-size:10px}
.bsheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:700;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 -2px 20px rgba(0,0,0,.12);padding:10px 18px 16px;transform:translateY(0);transition:transform .25s ease,opacity .25s}
.bsheet.off{transform:translateY(120%);opacity:0;pointer-events:none}
.bsheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.bsheet .x{position:absolute;right:10px;top:8px;width:32px;height:32px;border-radius:50%;color:var(--ink2);font-size:20px}
.bsheet .sub{font-size:12px;color:var(--ink2)}
.bsheet .ttl{font-size:17px;font-weight:700;line-height:1.4;margin:2px 28px 10px 0}
.sheet-btn{width:100%;margin-top:14px;height:46px;background:var(--primary);color:#fff;border-radius:999px;font-weight:700;font-size:15px}
.plist{max-height:150px;overflow:auto;margin-top:4px}
.plist button{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.plist button:last-child{border-bottom:0}

/* ---- 底部分頁 ---- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bar);border-top:1px solid var(--line);padding:6px 0 calc(26px + env(safe-area-inset-bottom,0px));z-index:500}
@media (max-width:520px){.tabbar{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);padding:4px 0}
.tabbar button[aria-selected="true"]{color:var(--primary);font-weight:700}

/* ---- 底部抽屜 ---- */
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:900;display:flex;align-items:flex-end}
.sheet-bg[hidden]{display:none}
.sheet{width:100%;max-height:80%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:24px}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad);font-weight:700;font-size:16px}
.sheet header button{color:var(--primary);font-size:15px}
.sheet .body{overflow-y:auto;padding-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--pad) 6px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.pr .sub{display:block;font-size:12px;color:var(--ink2);font-weight:400;margin-top:2px}

/* ---- 密碼畫面 ---- */
.lock{position:absolute;inset:0;z-index:950;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 28px 80px}
.lock[hidden]{display:none}
.lock h2{font-size:26px;font-weight:700;margin-bottom:6px}
.lock p{font-size:14px;color:var(--ink2);margin-bottom:22px;line-height:1.6}
.lock input[type=password]{width:100%;font-size:17px;padding:13px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--shadow-sm)}
.lock label.rm{display:flex;align-items:center;gap:8px;font-size:14px;margin:14px 0 18px;color:var(--ink2)}
.lock label.rm input{width:18px;height:18px;accent-color:var(--primary)}
.lock .go{width:100%;background:var(--primary);color:#fff;font-weight:700;font-size:16px;height:48px;border-radius:999px}
.lock .go:disabled{opacity:.6}
.lock .err{min-height:22px;margin-top:12px;font-size:14px;color:#DC2626}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:13.5px;padding:9px 16px;border-radius:999px;z-index:960;max-width:86%;text-align:center;box-shadow:var(--shadow-md)}
.toast[hidden]{display:none}
.loadmsg{padding:40px var(--pad);text-align:center;color:var(--ink2);line-height:1.8;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
 <div class="device">
  <div class="screen" id="screen">
   <div class="island" aria-hidden="true"></div>
   <div class="statusbar" aria-hidden="true"><span>9:41</span><span>▮▮▮</span></div>

   <header class="hdr">
     <h1 id="title">審查意見查詢</h1>
     <button class="scope" id="scope" hidden><span id="scopeTxt"></span><b class="car">▼</b></button>
     <button class="logout" id="logout" hidden>登出</button>
   </header>

   <!-- 查詢 -->
   <section class="view" id="v-search">
     <div class="controls">
       <label class="search">
         <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
         <input id="q" type="search" placeholder="搜尋意見、辦理情形、委員..." autocomplete="off" enterkeyhint="search" aria-label="關鍵字">
         <button class="clr" id="clr" aria-label="清除" hidden>×</button>
       </label>
       <div class="seg" role="group" aria-label="審查階段" id="seg"></div>
       <div class="row2">
         <button class="who" id="who"><span id="whoTxt">委員／單位：全部</span><span aria-hidden="true">▾</span></button>
         <button class="reset" id="reset">重設</button>
       </div>
     </div>
     <div class="count" id="count"></div>
     <div class="list" id="list"></div>
   </section>

   <!-- 地圖 -->
   <section class="view" id="v-map" hidden>
     <div id="map"></div>
     <div class="map-top"><label class="county"><span id="countyTxt">縣市：全部</span><select id="countySel" aria-label="縣市"></select></label></div>
     <div class="mapbtns">
       <button id="btnLocate" aria-label="回到我的位置" title="回到我的位置"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg></button>
       <button id="btnHome" aria-label="顯示全部範圍" title="顯示全部範圍"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
     </div>
     <button class="nocoord" id="nocoord" hidden></button>
     <div class="mlegend" aria-label="圖例"><span><i style="background:#EAB308"></i>進行中</span><span><i style="background:#16A34A"></i>已完成</span><span><i style="background:#94A3B8"></i>未設定</span></div>
     <div class="bsheet off" id="bsheet" role="dialog" aria-label="工程簡述">
       <div class="grab"></div>
       <button class="x" id="bsClose" aria-label="關閉">×</button>
       <div id="bsBody"></div>
     </div>
   </section>

   <!-- 委員 -->
   <section class="view" id="v-people" hidden>
     <div class="legend"><span><i style="background:var(--s1)"></i>期初</span><span><i style="background:var(--s2)"></i>期中</span><span><i style="background:var(--s3)"></i>期末</span><span>數字＝意見數</span></div>
     <div id="people"></div>
   </section>

   <!-- 會議 -->
   <section class="view" id="v-meet" hidden>
     <div class="sec-h">點選會議即可查看該場全部意見</div>
     <div id="meets"></div>
   </section>

   <nav class="tabbar" role="tablist">
     <button role="tab" aria-selected="true" data-v="search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>查詢</button>
     <button role="tab" aria-selected="false" data-v="map"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>地圖</button>
     <button role="tab" aria-selected="false" data-v="people"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14c2.6 0 4.2 1.6 4.6 4.5"/></svg>委員</button>
     <button role="tab" aria-selected="false" data-v="meet"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>會議</button>
   </nav>

   <div class="sheet-bg" id="sheetBg" hidden>
     <div class="sheet" role="dialog" aria-labelledby="sheetTtl">
       <header><span id="sheetTtl"></span><button id="sheetClose">完成</button></header>
       <div class="body" id="sheetBody"></div>
     </div>
   </div>

   <form class="lock" id="lock" hidden autocomplete="off">
     <h2>審查意見查詢</h2>
     <p>資料已加密，請輸入密碼。</p>
     <input type="password" id="pw" placeholder="密碼" aria-label="密碼" autocomplete="current-password">
     <label class="rm"><input type="checkbox" id="remember" checked>在這支手機記住密碼</label>
     <button class="go" id="go" type="submit">開啟</button>
     <div class="err" id="pwErr" role="alert"></div>
   </form>
   <div class="toast" id="toast" hidden></div>
   <div class="homebar" aria-hidden="true"></div>
  </div>
 </div>
</div>

<script src="lib/leaflet.js"></script>
<script>
/* =========================================================
   常數
   ========================================================= */
const STAGES=["期初","期中","期末"], PAGE=40, CLAMP_CHARS=60;
const GROUPS=["審查委員","主辦單位","相關機關與單位","會議結論"];
/* 地圖：台灣本島＋澎湖、金門、馬祖（可拖曳範圍） */
const TW_BOUNDS=[[21.75,117.95],[26.55,122.25]];
const COUNTIES={ /* [南,西,北,東] 概略範圍 */
 "基隆市":[25.05,121.62,25.20,121.82],"臺北市":[24.96,121.45,25.21,121.67],"新北市":[24.67,121.28,25.30,122.01],
 "桃園市":[24.59,120.98,25.12,121.47],"新竹市":[24.73,120.88,24.86,121.03],"新竹縣":[24.40,120.95,24.95,121.42],
 "苗栗縣":[24.27,120.62,24.74,121.26],"臺中市":[24.00,120.46,24.45,121.45],"彰化縣":[23.78,120.23,24.21,120.71],
 "南投縣":[23.44,120.62,24.25,121.35],"雲林縣":[23.50,120.08,23.84,120.74],"嘉義市":[23.44,120.40,23.52,120.50],
 "嘉義縣":[23.22,120.10,23.62,120.95],"臺南市":[22.88,120.02,23.42,120.66],"高雄市":[22.45,120.17,23.47,121.05],
 "屏東縣":[21.89,120.42,22.89,120.92],"宜蘭縣":[24.30,121.31,24.99,121.96],"花蓮縣":[23.10,120.98,24.38,121.70],
 "臺東縣":[21.98,120.73,23.45,121.62],"澎湖縣":[23.18,119.31,23.80,119.73],"金門縣":[24.38,118.20,24.53,118.50],
 "連江縣":[25.93,119.90,26.40,120.52]
};

/* =========================================================
   狀態
   ========================================================= */
let PROJECTS=[], DATA=[], MEETS=[], MEETBY={}, people=[];
const st={q:"",stage:"全部",who:null,meet:null,shown:PAGE,open:new Set(),exp:new Set(),county:"全部縣市",proj:null,view:"search"};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const terms=()=>st.q.trim().split(/\s+/).filter(Boolean);
function hl(text){
  let h=esc(text);const t=terms();if(!t.length)return h;
  const re=new RegExp("("+t.map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return h.replace(re,"<mark>$1</mark>");
}
const rocLong=d=>{const m=/^(\d+)\/(\d+)\/(\d+)$/.exec(d||"");return m?`${+m[1]}年${+m[2]}月${+m[3]}日`:(d||"—")};
const roundTxt=r=>r?`第${"一二三四五六七八九十"[r-1]||r}次`:"";
/* 類別：優先用資料裡的 role（轉檔工具判定），舊資料才用名稱推測 */
const ROLE_OF={};
function groupOf(n){
  if(ROLE_OF[n])return ROLE_OF[n];
  if(n==="會議結論")return "會議結論";
  if(n.includes("委員"))return "審查委員";
  if(/科|分署長|主任工程司|^本分署/.test(n))return "主辦單位";
  return "相關機關與單位";
}
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* =========================================================
   範圍（縣市｜工程）
   ========================================================= */
const projBy=f=>PROJECTS.find(p=>p.file===f);
function scopeFiles(){
  if(st.proj)return new Set([st.proj]);
  return new Set(PROJECTS.filter(p=>st.county==="全部縣市"||p.county===st.county).map(p=>p.file));
}
const multi=()=>scopeFiles().size>1;
function scoped(){const s=scopeFiles();return DATA.filter(d=>s.has(d.pid))}
function saveScope(){try{localStorage.setItem("scope",JSON.stringify({county:st.county,proj:st.proj}))}catch(e){}}
function setScope(county,proj){
  Object.assign(st,{county,proj,who:null,meet:null,stage:"全部",shown:PAGE});
  saveScope();people=buildPeople();renderScope();render();renderPeople();renderMeets();
}
function renderScope(){
  const p=st.proj&&projBy(st.proj);
  $("#scopeTxt").textContent=`${st.county}｜${p?p.name:"全部工程"}`;
}
function openScopeSheet(){
  const counties=["全部縣市",...new Set(PROJECTS.map(p=>p.county).filter(Boolean))];
  let selC=st.county;
  const draw=()=>{
    const ps=PROJECTS.filter(p=>selC==="全部縣市"||p.county===selC);
    const tot=ps.reduce((a,p)=>a+p.comments,0);
    $("#sheetBody").innerHTML=`<div class="sec-h" style="padding-top:4px">縣市</div><div class="chips">${counties.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${c===selC}">${esc(c)}</button>`).join("")}</div>
     <div class="sec-h">工程案</div><div class="group">
      <button class="pr${!st.proj&&selC===st.county?" sel":""}" data-p=""><span class="nm">全部工程<span class="sub">${ps.length} 案・${tot} 則意見</span></span></button>
      ${ps.map(p=>`<button class="pr${st.proj===p.file?" sel":""}" data-p="${esc(p.file)}"><span class="nm">${esc(p.name)}<span class="sub">${esc(p.county||"未設定縣市")}・${p.comments} 則意見</span></span></button>`).join("")}
     </div>`;
  };
  $("#sheetTtl").textContent="選擇縣市與工程";draw();$("#sheetBg").hidden=false;
  $("#sheetBody").onclick=e=>{
    const c=e.target.closest("[data-c]");if(c){selC=c.dataset.c;draw();return}
    const b=e.target.closest("[data-p]");if(!b)return;
    $("#sheetBg").hidden=true;setScope(selC,b.dataset.p||null);
  };
}

/* =========================================================
   查詢
   ========================================================= */
function buildPeople(){
  const m=new Map();scoped().forEach(d=>{if(!m.has(d.committee))m.set(d.committee,{name:d.committee,c:{期初:0,期中:0,期末:0}});const c=m.get(d.committee).c;if(d.stage in c)c[d.stage]++});
  return [...m.values()];
}
function matchQ(d,t){if(!t.length)return true;const hay=(d.comment+" "+d.response+" "+d.committee+" "+d.section+" "+d.note).toLowerCase();return t.every(x=>hay.includes(x))}
function base(){
  const t=terms().map(x=>x.toLowerCase());
  return scoped().filter(d=>(!st.who||d.committee===st.who)&&(!st.meet||d.mkey===st.meet)&&matchQ(d,t));
}
function filtered(){const b=base();return st.stage==="全部"?b:b.filter(d=>d.stage===st.stage)}
function renderSeg(){
  const b=base();
  $("#seg").innerHTML=["全部",...STAGES].map(s=>{const n=s==="全部"?b.length:b.filter(d=>d.stage===s).length;
    return `<button data-s="${s}" aria-pressed="${st.stage===s}">${s}<small>${n}</small></button>`}).join("");
}
/* 有關鍵字時：符合處不在前 3 行 → 自動展開；只有辦理情形符合 → 自動打開辦理情形 */
function autoState(d){
  const t=terms().map(x=>x.toLowerCase());if(!t.length)return {exp:false,open:false};
  const c=d.comment.toLowerCase();let first=-1;
  t.forEach(x=>{const i=c.indexOf(x);if(i>=0&&(first<0||i<first))first=i});
  const exp=first>=0&&(first>CLAMP_CHARS||(d.comment.slice(0,first).match(/\n/g)||[]).length>=2);
  const inResp=t.some(x=>d.response.toLowerCase().includes(x));
  return {exp,open:first<0&&inResp};
}
function card(d){
  const a=autoState(d);
  const exp=st.exp.has(d.id)!==a.exp; /* 使用者點擊可反轉自動狀態 */
  const open=st.open.has(d.id)!==a.open;
  const m=MEETBY[d.mkey];
  const resp=d.response
    ?`<button class="resp-btn" aria-expanded="${open}" data-id="${esc(d.id)}">辦理情形 <span class="chev">▼</span></button><div class="resp" ${open?"":"hidden"}>${hl(d.response)}</div>`
    :`<div class="noresp">此次會議紀錄未附辦理情形</div>`;
  return `<article class="card${exp?" exp":""}" data-s="${esc(d.stage)}" data-id="${esc(d.id)}">
    <div class="tags"><span class="tg st">${esc(d.stage)}${m&&m.multi?roundTxt(m.round):""}</span><span class="tg mb">${hl(d.committee)}</span><span class="tg">第 ${esc(d.no)} 點</span>${d.note?`<span class="tg">${esc(d.note)}</span>`:""}${d.section?`<span class="tg">${hl(d.section)}</span>`:""}${multi()?`<span class="tg pj">${esc(d.pname)}</span>`:""}</div>
    <p class="txt">${hl(d.comment)}</p><div class="morehint">點擊展開全文 ▾</div>${resp}</article>`;
}
function markClamped(){
  document.querySelectorAll("#list .card:not(.exp)").forEach(c=>{const t=c.querySelector(".txt");c.classList.toggle("clamped",t.scrollHeight>t.clientHeight+2)});
}
function renderList(){
  const r=filtered();const mt=st.meet&&MEETBY[st.meet];
  $("#count").textContent=`共 ${r.length} 則意見`+(mt?`（${mt.title}）`:"")+(st.q.trim()?`，關鍵字「${st.q.trim()}」`:"");
  $("#list").innerHTML=r.length?r.slice(0,st.shown).map(card).join("")+(r.length>st.shown?`<button class="more" id="more">載入更多（尚有 ${r.length-st.shown} 則）</button>`:"")
    :`<div class="empty">找不到符合的意見。<br>試試較短的關鍵字，或把階段切回「全部」。</div>`;
  $("#whoTxt").textContent="委員／單位："+(st.who||"全部");
  $("#who").classList.toggle("on",!!st.who);
  $("#clr").hidden=!st.q;
  requestAnimationFrame(markClamped);
}
function render(){renderSeg();renderList()}

/* =========================================================
   委員／會議
   ========================================================= */
function peopleRows(sel){
  return GROUPS.map(g=>{const ps=people.filter(p=>groupOf(p.name)===g);if(!ps.length)return "";
    return `<div class="sec-h">${g}</div><div class="group">`+ps.map(p=>`<button class="pr${sel===p.name?" sel":""}" data-who="${esc(p.name)}"><span class="nm">${esc(p.name)}</span><span class="dots">${STAGES.map((s,i)=>`<span class="dot s${i+1}${p.c[s]?"":" zero"}">${p.c[s]||"–"}</span>`).join("")}</span></button>`).join("")+`</div>`}).join("")
    ||`<div class="loadmsg">此範圍沒有意見資料</div>`;
}
function renderPeople(){$("#people").innerHTML=peopleRows(null)}
function renderMeets(){
  const s=scopeFiles();
  $("#meets").innerHTML=MEETS.filter(m=>s.has(m.pid)).map(m=>{const ds=DATA.filter(d=>d.mkey===m.key);const w=new Set(ds.map(d=>d.committee)).size;
    return `<button class="mt" data-meet="${esc(m.key)}" data-s="${esc(m.stage)}"><div class="big">${esc(m.stage)}${m.multi?`<small>${roundTxt(m.round)}</small>`:""}</div>${multi()?`<div class="pjn">${esc(m.pname)}</div>`:""}<div class="n"><b>${ds.length}</b> 則</div>
      <div class="info"><div class="info-row"><span class="info-label">會議名稱</span><span class="info-value">${esc(m.title)}</span></div>
      <div class="info-row"><span class="info-label">日期</span><span class="info-value">${rocLong(m.date)}</span></div>
      <div class="info-row"><span class="info-label">地點</span><span class="info-value">${esc(m.place||"—")}</span></div>
      <div class="info-row"><span class="info-label">主持人</span><span class="info-value">${esc(m.chair||"—")}</span></div>
      <div class="info-row"><span class="info-label">發言</span><span class="info-value">${w} 位委員／單位</span></div></div></button>`}).join("")||`<div class="loadmsg">此範圍尚無會議資料</div>`;
}

/* =========================================================
   地圖
   ========================================================= */
let map=null,markers={},meMarker=null,meCircle=null,selPin=null;
const PIN_COLOR={"進行中":"#EAB308","已完成":"#16A34A"};
const pinColor=st=>PIN_COLOR[st]||"#94A3B8";
const pinSvg=c=>`<svg width="30" height="38" viewBox="0 0 30 38"><path d="M15 37s12-12.2 12-22A12 12 0 0 0 3 15c0 9.8 12 22 12 22z" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="15" cy="15" r="4.5" fill="#fff"/></svg>`;
function initMap(){
  if(map||typeof L==="undefined"){if(typeof L==="undefined")$("#map").innerHTML='<div class="loadmsg">地圖元件載入失敗</div>';return}
  const b=L.latLngBounds(TW_BOUNDS);
  map=L.map("map",{zoomControl:true,maxBounds:b,maxBoundsViscosity:1,minZoom:7,maxZoom:18,attributionControl:true,zoomSnap:.5});
  map.zoomControl.setPosition("bottomright");map.attributionControl.setPrefix(false);
  L.tileLayer("https://wmts.nlsc.gov.tw/wmts/EMAP5/default/GoogleMapsCompatible/{z}/{y}/{x}",{minZoom:7,maxZoom:18,maxNativeZoom:18,bounds:b,attribution:"© 內政部國土測繪中心"}).addTo(map);
  map.fitBounds([[21.85,119.3],[25.35,122.05]]);
  map.on("click",()=>hideSheet());
  const sel=$("#countySel");
  sel.innerHTML=`<option value="">全部</option>`+Object.keys(COUNTIES).map(c=>`<option>${c}</option>`).join("");
  sel.onchange=()=>{const c=sel.value;$("#countyTxt").textContent="縣市："+(c||"全部");hideSheet();
    if(!c)map.flyToBounds([[21.85,119.3],[25.35,122.05]],{duration:.6});else{const r=COUNTIES[c];map.flyToBounds([[r[0],r[1]],[r[2],r[3]]],{duration:.6,padding:[10,10]})}};
  drawPins();
}
function drawPins(){
  if(!map)return;
  Object.values(markers).forEach(m=>m.remove());markers={};
  PROJECTS.forEach(p=>{if(p.lat==null||p.lng==null)return;
    const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"pin",html:pinSvg(pinColor(p.status)),iconSize:[30,38],iconAnchor:[15,37]}),title:p.name,keyboard:true}).addTo(map);
    mk.on("click",e=>{L.DomEvent.stopPropagation(e);showProject(p.file)});markers[p.file]=mk});
  const nc=PROJECTS.filter(p=>p.lat==null||p.lng==null);
  $("#nocoord").hidden=!nc.length;$("#nocoord").textContent=`${nc.length} 案未設定座標 ›`;
}
function memberSummary(file){
  const names=[...new Set(DATA.filter(d=>d.pid===file&&groupOf(d.committee)==="審查委員").map(d=>d.committee))];
  if(!names.length)return "—";
  const short=names.slice(0,2);
  return short.join("、")+(names.length>2?`等 ${names.length} 位`:` ${names.length} 位`);
}
function showProject(file){
  const p=projBy(file);if(!p)return;
  if(selPin)selPin.classList.remove("on");
  const mk=markers[file];
  const row=(k,v,cls="")=>`<div class="info-row"><span class="info-label">${k}：</span><span class="info-value ${cls}">${v}</span></div>`;
  $("#bsBody").innerHTML=`<div class="sub">工程名稱</div><div class="ttl">${esc(p.name)}</div>`+
    row("所在縣市",esc(p.county||"—"))+row("執行年份",esc(p.year||"—"))+row("主辦機關",esc(p.agency||"—"))+row("主辦承辦",esc(p.officer||"—"))+
    (p.status?row("工程狀態",esc(p.status)):"")+row("審查委員",esc(memberSummary(file)))+row("累計意見",`${p.comments} 則`,"num")+
    `<button class="sheet-btn" data-goto="${esc(file)}">查看本案意見列表</button>`;
  $("#bsheet").classList.remove("off");$("#v-map").classList.add("sheeton");
  if(mk){selPin=mk.getElement();selPin&&selPin.classList.add("on");
    /* 讓標點落在抽屜上方可見區域的中間 */
    const h=$("#bsheet").offsetHeight, z=Math.max(map.getZoom(),13);
    const c=map.unproject(map.project(mk.getLatLng(),z).add([0,h/2]),z);
    map.flyTo(c,z,{duration:.7});}
}
function showNoCoord(){
  if(selPin)selPin.classList.remove("on");
  const nc=PROJECTS.filter(p=>p.lat==null||p.lng==null);
  $("#bsBody").innerHTML=`<div class="sub">尚未設定座標的工程</div><div class="plist">${nc.map(p=>`<button data-show="${esc(p.file)}">${esc(p.name)}</button>`).join("")}</div>`;
  $("#bsheet").classList.remove("off");$("#v-map").classList.add("sheeton");
}
function hideSheet(){$("#bsheet").classList.add("off");$("#v-map").classList.remove("sheeton");if(selPin){selPin.classList.remove("on");selPin=null}}
function locateMe(){
  if(!window.isSecureContext||!navigator.geolocation){toast("定位需要用 https 網址開啟");return}
  const btn=$("#btnLocate");btn.classList.add("locating");
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove("locating");
    const ll=L.latLng(pos.coords.latitude,pos.coords.longitude);
    if(!L.latLngBounds(TW_BOUNDS).contains(ll)){toast("您目前的位置不在地圖範圍內");return}
    if(meMarker){meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(pos.coords.accuracy)}
    else{meCircle=L.circle(ll,{radius:pos.coords.accuracy,color:"#2563EB",weight:1,fillOpacity:.12}).addTo(map);
      meMarker=L.marker(ll,{icon:L.divIcon({className:"me-dot",iconSize:[16,16]}),interactive:false}).addTo(map)}
    map.flyTo(ll,Math.max(map.getZoom(),15),{duration:.8});
  },err=>{btn.classList.remove("locating");toast(err.code===1?"請允許瀏覽器使用定位權限":"無法取得目前位置，請稍後再試")},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}

function go(v){
  st.view=v;
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));

  $("#scope").hidden=v==="map"||!PROJECTS.length;
  if(v==="map"){initMap();setTimeout(()=>map&&map.invalidateSize(),50)}
}

/* =========================================================
   讀取與解密（AES-256-GCM／PBKDF2-SHA256）
   ========================================================= */
const nocache=u=>u+(u.includes("?")?"&":"?")+"t="+Date.now();
async function getJSON(u){const r=await fetch(nocache(u),{cache:"no-store"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
const KEYSTORE="reviewKey";
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tb64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
let KEY=null,KEYSALT=null;
const isEnc=o=>o&&typeof o==="object"&&"ct" in o&&"iv" in o;
async function deriveKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:ub64(salt),iterations:iter},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
async function decryptWith(key,o){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(o.iv)},key,ub64(o.ct));return JSON.parse(new TextDecoder().decode(pt))}
async function loadStoredKey(salt){try{const s=JSON.parse(localStorage.getItem(KEYSTORE)||"null");if(!s||s.salt!==salt)return null;return await crypto.subtle.importKey("raw",ub64(s.k),{name:"AES-GCM"},true,["decrypt"])}catch(e){return null}}
async function storeKey(key,salt){try{localStorage.setItem(KEYSTORE,JSON.stringify({salt,k:tb64(await crypto.subtle.exportKey("raw",key))}))}catch(e){}}
function clearKey(){try{localStorage.removeItem(KEYSTORE)}catch(e){}}
function askPassword(encIdx){
  return new Promise(resolve=>{
    const f=$("#lock");f.hidden=false;$("#pw").value="";$("#pwErr").textContent="";setTimeout(()=>$("#pw").focus(),50);
    f.onsubmit=async e=>{e.preventDefault();const pw=$("#pw").value;if(!pw)return;
      $("#go").disabled=true;$("#go").textContent="解密中…";$("#pwErr").textContent="";
      try{const key=await deriveKey(pw,encIdx.salt,encIdx.iter);const idx=await decryptWith(key,encIdx);
        if($("#remember").checked)await storeKey(key,encIdx.salt);f.hidden=true;resolve({key,idx})}
      catch(err){$("#pwErr").textContent="密碼錯誤，請再試一次。"}
      finally{$("#go").disabled=false;$("#go").textContent="開啟"}};
  });
}
async function getData(u){const o=await getJSON(u);if(!isEnc(o))return o;if(!KEY||o.salt!==KEYSALT)throw new Error("密碼已更換，請登出後重新輸入");return decryptWith(KEY,o)}
function showMsg(html){$("#list").innerHTML=`<div class="loadmsg">${html}</div>`;$("#count").textContent=""}

async function loadAll(list){
  showMsg("資料載入中…");
  const order=new Map(STAGES.map((s,i)=>[s,i]));
  PROJECTS=[];DATA=[];MEETS=[];MEETBY={};Object.keys(ROLE_OF).forEach(k=>delete ROLE_OF[k]);
  const files=await Promise.all(list.map(p=>getData("data/"+encodeURIComponent(p.file)).then(d=>({p,d}))));
  files.forEach(({p,d},pi)=>{
    const pj=d.project||{};
    const proj={file:p.file,name:pj.name||p.name,county:pj.county||"",year:pj.year||"",agency:pj.agency||"",officer:pj.officer||"",status:pj.status||"",
      lat:typeof pj.lat==="number"?pj.lat:null,lng:typeof pj.lng==="number"?pj.lng:null,comments:(d.comments||[]).length};
    PROJECTS.push(proj);
    const ms=(d.meetings||[]).slice().sort((a,b)=>(order.get(a.stage)??9)-(order.get(b.stage)??9)||(a.round||0)-(b.round||0)||String(a.date).localeCompare(String(b.date)));
    const per={};ms.forEach(m=>per[m.stage]=(per[m.stage]||0)+1);
    ms.forEach((m,i)=>{const key=p.file+"|"+m.id;const mm={...m,key,pid:p.file,pname:proj.name,multi:per[m.stage]>1,idx:pi*1000+i};MEETS.push(mm);MEETBY[key]=mm});
    (d.comments||[]).forEach(c=>{if(c.role&&c.committee)ROLE_OF[c.committee]=c.role});
    (d.comments||[]).forEach((c,i)=>DATA.push({...c,id:p.file+"|"+(c.id??i),_i:i,pid:p.file,pname:proj.name,mkey:p.file+"|"+c.meeting,
      note:c.note||"",section:c.section||"",response:c.response||"",comment:c.comment||"",committee:c.committee||"",no:c.no??""}));
  });
  DATA.sort((a,b)=>((MEETBY[a.mkey]?.idx??1e9)-(MEETBY[b.mkey]?.idx??1e9))||a._i-b._i);
  let saved=null;try{saved=JSON.parse(localStorage.getItem("scope")||"null")}catch(e){}
  if(saved&&(saved.proj?projBy(saved.proj):true)&&(saved.county==="全部縣市"||PROJECTS.some(p=>p.county===saved.county))){st.county=saved.county;st.proj=saved.proj||null}
  else if(PROJECTS.length===1){st.county=PROJECTS[0].county||"全部縣市";st.proj=PROJECTS[0].file}
  people=buildPeople();renderScope();$("#scope").hidden=st.view==="map";
  render();renderPeople();renderMeets();drawPins();
}
async function init(){
  if(location.protocol==="file:"){showMsg("請用「開啟App.bat」或網址開啟本 App。<br>（直接雙擊 index.html 無法讀取資料）");return}
  try{
    let idx=await getJSON("data/index.json");
    if(isEnc(idx)){
      KEYSALT=idx.salt;$("#logout").hidden=false;
      if(!(window.crypto&&crypto.subtle)){showMsg("此瀏覽器無法解密，請用 https 網址開啟。");return}
      KEY=await loadStoredKey(idx.salt);let plain=null;
      if(KEY){try{plain=await decryptWith(KEY,idx)}catch(e){KEY=null;clearKey()}}
      if(!plain){showMsg("請輸入密碼");const r=await askPassword(idx);KEY=r.key;plain=r.idx}
      idx=plain;
    }
    const list=idx.projects||[];
    if(!list.length){showMsg("data 資料夾內還沒有案子。<br>請先用轉檔工具匯出。");return}
    await loadAll(list);
  }catch(e){console.error(e);showMsg("資料讀取失敗，請確認網路連線。<br><small>"+esc(e.message)+"</small>")}
}
$("#logout").onclick=()=>{clearKey();location.reload()};
init();
</script>
